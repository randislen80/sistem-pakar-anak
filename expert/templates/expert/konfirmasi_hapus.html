{% extends "main.html" %}

{% block title %}{{ judul }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 640px">
    <div class="page-head"><h1>{{ judul }}</h1></div>
    <form method="post" class="card-sp">
        {% csrf_token %}
        <input type="hidden" name="kembali" value="{{ request.GET.kembali }}">
        <div class="card-body">
            <p class="mb-2"><i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>
                Anda akan menghapus <b>{{ objek }}</b>. Tindakan ini tidak dapat dibatalkan.</p>
            {% if saran %}<div class="alert alert-info small mb-0 mt-3"><i class="bi bi-info-circle me-1"></i>{{ saran }}</div>{% endif %}
        </div>
        <div class="card-body border-top d-flex justify-content-between">
            <a href="{{ batal_url }}" class="btn btn-light">Batal</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Ya, hapus</button>
        </div>
    </form>
</div>
{% endblock %}
